<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Ordering System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Food Ordering System</h1>

        <!-- Customer Management -->

        <div class="form-section">

            <h2>Customer Management</h2>

            <h3>Add Customer</h3>

            <form id="customerForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Customer Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="text"
                    id="phone"
                    placeholder="Phone"
                    required
                >

                <button type="submit">
                    Add Customer
                </button>

            </form>

        </div>


        <div class="customers-section">

            <h2>Customers</h2>

            <button id="loadCustomersBtn">
                Load Customers
            </button>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="customerTableBody">
                </tbody>

            </table>

        </div>


        <!-- Order Management -->

        <div class="form-section">

            <h2>Order Management</h2>

            <h3>Add Order</h3>

            <form id="orderForm">

                <input
                    type="number"
                    id="customerId"
                    placeholder="Customer ID"
                    required
                >

                <input
                    type="text"
                    id="product"
                    placeholder="Product"
                    required
                >

                <input
                    type="number"
                    id="quantity"
                    placeholder="Quantity"
                    min="1"
                    required
                >

                <button type="submit">
                    Add Order
                </button>

            </form>

        </div>


        <div class="orders-section">

            <h2>Orders</h2>

            <button id="loadOrdersBtn">
                Load Orders
            </button>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Customer ID</th>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="orderTableBody">
                </tbody>

            </table>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
